apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ===== SLICE-1 AMF =====
      - job_name: 'slice-1-amf'
        static_configs:
          - targets: ['amf-svc.slice-1.svc.cluster.local:9090']
        metrics_path: /metrics
        fallback_scrape_protocol: PrometheusText0.0.4
        metric_relabel_configs:
          - target_label: slice
            replacement: "slice-1"

      # ===== SLICE-1 SMF =====
      - job_name: 'slice-1-smf'
        static_configs:
          - targets: ['smf-svc.slice-1.svc.cluster.local:9090']
        metrics_path: /metrics
        fallback_scrape_protocol: PrometheusText0.0.4
        metric_relabel_configs:
          - target_label: slice
            replacement: "slice-1"

      # ===== THÊM SLICE-2 KHI CÓ =====
      # - job_name: 'slice-2-amf'
