# RAN scheduler policy for the three fixed lab S-NSSAIs.
#
# dedicated: PRBs reserved exclusively for a slice when it has traffic.
# minimum:    protected share while slices compete for the cell.
# maximum:    hard ceiling, used to keep low-cost/massive-IoT traffic bounded.
#
# Dedicated ratios sum to 50%, leaving half of the 10 MHz cell dynamically
# shareable. Minimum ratios sum to 80%, so the configuration remains feasible.
cell_cfg:
  slicing:
    - sst: 1
      sd: 1
      sched_cfg:
        ded_prb_policy_ratio: 20
        min_prb_policy_ratio: 40
        max_prb_policy_ratio: 100
    - sst: 2
      sd: 1
      sched_cfg:
        ded_prb_policy_ratio: 25
        min_prb_policy_ratio: 30
        max_prb_policy_ratio: 60
    - sst: 3
      sd: 1
      sched_cfg:
        ded_prb_policy_ratio: 5
        min_prb_policy_ratio: 10
        max_prb_policy_ratio: 30
