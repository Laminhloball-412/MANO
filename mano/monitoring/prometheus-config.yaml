apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: open5gs-slice-exporter
        static_configs:
          - targets:
              - slice-exporter:8080
    
      - job_name: shared-amf
        static_configs:
          - targets:
              - amf-metrics.share.svc.cluster.local:9090
            labels:
              nf_type: amf
              scope: shared
    
      - job_name: slice-1-smf
        static_configs:
          - targets:
              - smf-metrics.slice-1.svc.cluster.local:9090
            labels:
              slice_id: slice-1
              slice_type: eMBB
              sst: "1"
              sd: "000001"
              nf_type: smf
    
      - job_name: slice-2-smf
        static_configs:
          - targets:
              - smf-metrics.slice-2.svc.cluster.local:9090
            labels:
              slice_id: slice-2
              slice_type: URLLC
              sst: "2"
              sd: "000001"
              nf_type: smf
    
      - job_name: slice-3-smf
        static_configs:
          - targets:
              - smf-metrics.slice-3.svc.cluster.local:9090
            labels:
              slice_id: slice-3
              slice_type: mMTC
              sst: "3"
              sd: "000001"
              nf_type: smf
    
      - job_name: ansa-session-orchestrator
        scrape_interval: 5s
        static_configs:
          - targets:
              - 192.168.180.35:9105
    
      - job_name: ansa-intent-engine
        scrape_interval: 5s
        static_configs:
          - targets:
              - 192.168.180.35:9106
    
      - job_name: lab-node-exporter
        scrape_interval: 15s
        static_configs:
          - targets:
              - 192.168.180.35:9100
    
      - job_name: srsran-kpm-prb
        scrape_interval: 1s
        static_configs:
          - targets:
              - 192.168.180.35:9108
            labels:
              source: e2sm-kpm
              ran: srsran-project
