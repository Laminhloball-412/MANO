logger:
  file:
    path: /open5gs/install/var/log/open5gs/upf.log

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - address: __POD_IP__
        advertise: __POD_IP__
  gtpu:
    server:
      - address: __POD_IP__
        advertise: __POD_IP__
  session:
    - subnet: 10.45.2.0/24
      gateway: 10.45.2.1
    - subnet: 2001:db8:2::/48
      gateway: 2001:db8:2::1
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090