logger:
  file:
    path: /open5gs/install/var/log/open5gs/smf.log

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: smf-svc:7777
    client:
      nrf:
        - uri: http://nrf-svc:7777
  pfcp:
    server:
      - address: 0.0.0.0
    client:
      upf:
        - address: upf-svc
  gtpu:
    server:
      - address: 0.0.0.0
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1
  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
  mtu: 1400