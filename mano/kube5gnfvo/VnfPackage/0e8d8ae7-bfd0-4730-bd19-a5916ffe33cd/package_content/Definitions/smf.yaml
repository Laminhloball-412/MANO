tosca_definitions_version: tosca_simple_yaml_1_0

topology_template:
  node_templates:
    VNF1:
      type: tosca.nodes.nfv.VNF
      properties:
        descriptor_id: 2cf97a96-d17c-4f21-86d3-af2532ea1smf
        descriptor_version: 1.0
        provider: imac
        product_name: smf
        software_version: latest

    VDU1:
      type: tosca.nodes.nfv.Vdu.Compute
      properties:
        sw_image_data:
          name: open5gs
          provider: nguyen0105/open5gs
          version: v2.7.7
          diskFormat: raw
      capabilities:
        virtual_compute:
          properties:
            virtual_memory:
              virtual_mem_size: 256Mi
            virtual_cpu:
              num_virtual_cpu: 100m
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: nguyen0105/open5gs:v2.7.7
        smfcfg:
          type: tosca.artifacts.File
          file: Files/Artifacts/smfcfg.conf
          deploy_path: /open5gs/install/etc/open5gs/smf.yaml
        open5gs:
          type: tosca.artifacts.File
          file: Files/Artifacts/open5gs.conf
          deploy_path: /open5gs/install/etc/freeDiameter/smf.conf
      attributes:
        namespace: default
        replicas: 1
        name_of_service: smf-svc
        is_export_service: True
        protocol:
          - TCP
          - TCP
          - UDP
        ports:
          - 7777
          - 3868
          - 8805
        command: [sh, -c, "sleep 5 && /open5gs-entrypoint.sh && ./install/bin/open5gs-smfd"]
        privileged: True 
    CP1:
      type: tosca.nodes.nfv.Cpd
      properties:
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL1

    VL1:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: management
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              dhcp_enabled: False

    CP2:
      type: tosca.nodes.nfv.Cpd
      properties:
        type: ovs
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL2

    VL2:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: ovs-net
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              cidr: 192.168.2.0/23
