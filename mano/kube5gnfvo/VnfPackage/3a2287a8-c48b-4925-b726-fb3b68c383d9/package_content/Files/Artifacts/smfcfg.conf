logger:
  file:
    path: /open5gs/install/var/log/open5gs/smf.log

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: smf-svc.slice-3.svc.cluster.local
    client:
      nrf:
        - uri: http://nrf-svc.share.svc.cluster.local:7777

  pfcp:
    server:
      - address: __POD_IP__
        advertise: __POD_IP__
    client:
      upf:
        - address: upf-svc.slice-3.svc.cluster.local

  gtpu:
    server:
      - address: __POD_IP__
        advertise: __POD_IP__

  metrics:
    server:
      - address: 0.0.0.0
        port: 9090

  session:
    - subnet: 10.45.3.0/24
      gateway: 10.45.3.1
      dnn: srsapn
    - subnet: 2001:db8:3::/48
      gateway: 2001:db8:3::1
      dnn: srsapn

  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844

  mtu: 1400

  info:
    - s_nssai:
        - sst: 1
          sd: "000003"
          dnn:
            - srsapn