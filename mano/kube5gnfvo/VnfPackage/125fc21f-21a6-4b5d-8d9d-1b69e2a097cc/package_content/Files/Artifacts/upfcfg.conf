logger:
  file:
    path: /open5gs/install/var/log/open5gs/upf.log

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - dev: eth0
  gtpu:
    server:
      - address: 0.0.0.0
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.3.1
    - subnet: 2001:db8:3::/48
      gateway: 2001:db8:3::1
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090