      nrf:
        - uri: http://nrf-svc:7777
  ngap:
    server:
      - address: 0.0.0.0
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
  guami:
    - plmn_id:
        mcc: 460
        mnc: 99
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 460
        mnc: 99
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 460
        mnc: 99
      s_nssai:
        - sst: 1
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540