tosca_definitions_version: tosca_simple_yaml_1_0

topology_template:
  node_templates:
    VNF1:
      type: tosca.nodes.nfv.VNF
      properties:
        descriptor_id: da73f6de-3b2a-4f49-aa7d-65be6bc6csmf
        descriptor_version: 1.0
        provider: imac
        product_name: smf
        software_version: latest

    VDU1:
      type: tosca.nodes.nfv.Vdu.Compute
      properties:
        sw_image_data:
          name: open5gs
          provider: nguyen0105/open5gs
          version: v2.7.7
          diskFormat: raw
      capabilities:
        virtual_compute:
          properties:
            virtual_memory:
              virtual_mem_size: 256Mi
            virtual_cpu:
              num_virtual_cpu: 100m
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: nguyen0105/open5gs:v2.7.7
        smfcfg:
          type: tosca.artifacts.File
          file: Files/Artifacts/smfcfg.conf
          deploy_path: /open5gs/install/etc/open5gs/smf.yaml
        open5gs:
          type: tosca.artifacts.File
          file: Files/Artifacts/open5gs.conf
          deploy_path: /open5gs/install/etc/freeDiameter/smf.conf
      attributes:
        namespace: slice-1
        replicas: 1
        name_of_service: smf-svc
        is_export_service: True
        protocol:
          - TCP
          - TCP
          - UDP
        ports:
          - 7777
          - 3868
          - 8805
        command: [sh, -c, "TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token; CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt; for i in $(seq 1 30); do [ -f \"$TOKEN\" ] && [ -f \"$CACERT\" ] && [ -s \"$TOKEN\" ] && break; sleep 1; done; if [ ! -s \"$TOKEN\" ]; then echo \"FATAL: ServiceAccount token khong xuat hien sau 30s\" >&2; exit 1; fi; UPF_IP=\"\"; for i in $(seq 1 60); do UPF_IP=$(curl -s --cacert \"$CACERT\" -H \"Authorization: Bearer $(cat $TOKEN)\" \"https://kubernetes.default.svc/api/v1/namespaces/slice-1/pods?labelSelector=app=upf-svc&fieldSelector=status.phase=Running\" | grep -o '\"podIP\":\"[0-9.]*\"' | head -1 | sed 's/.*\"\\([0-9.]*\\)\"/\\1/'); [ -n \"$UPF_IP\" ] && break; sleep 2; done; if [ -z \"$UPF_IP\" ]; then echo \"FATAL: khong tra duoc Pod IP cua UPF sau 120s\" >&2; exit 1; fi; echo \"UPF_IP resolved: $UPF_IP\"; cp /open5gs/install/etc/open5gs/smf.yaml /tmp/smf.yaml; sed -i \"s/address: upf-svc.slice-1.svc.cluster.local/address: ${UPF_IP}/\" /tmp/smf.yaml; sleep 5 && /open5gs-entrypoint.sh && ./install/bin/open5gs-smfd -c /tmp/smf.yaml"]
        privileged: True 
    CP1:
      type: tosca.nodes.nfv.Cpd
      properties:
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL1

    VL1:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: management
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              dhcp_enabled: False

    CP2:
      type: tosca.nodes.nfv.Cpd
      properties:
        type: ovs
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL2

    VL2:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: ovs-net
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              cidr: 192.168.2.0/23
