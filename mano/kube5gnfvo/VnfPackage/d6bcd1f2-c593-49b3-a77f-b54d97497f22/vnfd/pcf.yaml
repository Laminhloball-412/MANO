tosca_definitions_version: tosca_simple_yaml_1_0

topology_template:
  node_templates:
    VNF1:
      type: tosca.nodes.nfv.VNF
      properties:
        descriptor_id: 3b4cbda0-676f-4322-85a0-6644da5d6pcf
        descriptor_version: 1.0
        provider: imac
        product_name: pcf
        software_version: latest

    VDU1:
      type: tosca.nodes.nfv.Vdu.Compute
      properties:
        sw_image_data:
          name: open5gs
          provider: nguyen0105/open5gs
          version: v2.7.7
          diskFormat: raw
      capabilities:
        virtual_compute:
          properties:
            virtual_memory:
              virtual_mem_size: 256Mi
            virtual_cpu:
              num_virtual_cpu: 50m
      artifacts:
        sw_image:
          type: tosca.artifacts.nfv.SwImage
          file: nguyen0105/open5gs:v2.7.7
        pcfcfg:
          type: tosca.artifacts.File
          file: Files/Artifacts/pcfcfg.conf
          deploy_path: /open5gs/install/etc/open5gs/pcf.yaml
      attributes:
        namespace: slice-2
        replicas: 1
        name_of_service: pcf-svc
        is_export_service: True
        protocol:
          - TCP
        ports:
          - 7777
        command: [sh, -c, "sleep 5 && /open5gs-entrypoint.sh && ./install/bin/open5gs-pcfd"]
        privileged: True 
    CP1:
      type: tosca.nodes.nfv.Cpd
      properties:
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL1

    VL1:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: management
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              dhcp_enabled: False

    CP2:
      type: tosca.nodes.nfv.Cpd
      properties:
        type: ovs
        layer_protocol: ipv4
      requirements:
        virtual_binding: VDU1
        virtual_link: VL2

    VL2:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        network_name: ovs-net
        vl_profile:
          virtual_link_protocol_data:
            l3_protocol_data:
              cidr: 192.168.2.0/23
