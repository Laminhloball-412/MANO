logger:
  file:
    path: /open5gs/install/var/log/open5gs/pcf.log

global:
  max:
    ue: 1024
    
db_uri: mongodb://mongodb-svc.share.svc.cluster.local/open5gs

pcf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: pcf-svc.slice-2.svc.cluster.local
    client:
      nrf:
        - uri: http://nrf-svc.share.svc.cluster.local:7777
      bsf:
        - uri: http://bsf-svc.share.svc.cluster.local:7777
  metrics: 
    server:
      - address: 0.0.0.0
        port: 9090

