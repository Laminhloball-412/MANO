logger:
  file:
    path: /open5gs/install/var/log/open5gs/smf.log

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: smf-svc.slice-4.svc.cluster.local
    client:
      nrf:
        - uri: http://nrf-svc.share.svc.cluster.local:7777

  pfcp:
    server:
      - dev: eth0
    client:
      upf:
        - address: upf-svc.slice-4.svc.cluster.local

  gtpu:
    server:
      - address: 0.0.0.0

  metrics:
    server:
      - address: 0.0.0.0
        port: 9090

  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.4.1
      dnn: srsapn
    - subnet: 2001:db8:4::/48
      gateway: 2001:db8:4::1
      dnn: srsapn

  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844

  mtu: 1400

  info:
    - s_nssai:
        - sst: 1
          sd: "000002"
          dnn:
            - srsapn