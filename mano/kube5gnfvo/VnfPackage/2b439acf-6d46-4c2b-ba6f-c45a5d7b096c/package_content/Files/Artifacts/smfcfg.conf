logger:
  file:
    path: /open5gs/install/var/log/open5gs/smf.log

smf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
    client:
      nrf:
        - uri: http://nrf-svc:7777
  pfcp:
    server:
      - address: 0.0.0.0
    client:
      upf:
        - address: upf-svc
  gtpc:
    server:
      - address: 0.0.0.0
  gtpu:
    server:
      - address: 0.0.0.0
  subnet:
    - addr: 10.45.0.1/16
    - addr: cafe::1/64
  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
  mtu: 1400
  freeDiameter: /open5gs/install/etc/freeDiameter/smf.conf
