apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'open5gs-slice-exporter'
        static_configs:
          - targets: ['slice-exporter:8080']

      - job_name: 'slice-1-amf'
        static_configs:
          - targets: ['amf-metrics.slice-1.svc.cluster.local:9090']
            labels:
              slice_id: slice-1
              nf_type: amf

      - job_name: 'slice-1-smf'
        static_configs:
          - targets: ['smf-metrics.slice-1.svc.cluster.local:9090']
            labels:
              slice_id: slice-1
              nf_type: smf
      - job_name: 'slice-2-amf'
        static_configs:
          - targets: ['amf-metrics.slice-1.svc.cluster.local:9090']
            labels:
              slice_id: slice-2
              nf_type: amf

      - job_name: 'slice-2-smf'
        static_configs:
          - targets: ['smf-metrics.slice-1.svc.cluster.local:9090']
            labels:
              slice_id: slice-2
              nf_type: smf
