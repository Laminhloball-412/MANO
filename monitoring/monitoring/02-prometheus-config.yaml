apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'open5gs-slice-exporter'
        static_configs:
          - targets: ['slice-exporter:8080']

      # AMF is shared by all slices. Scrape it once and use its snssai label
      # when a dashboard needs registered UE counts per slice.
      - job_name: 'shared-amf'
        static_configs:
          - targets: ['amf-metrics.share.svc.cluster.local:9090']
            labels:
              nf_type: amf
              scope: shared

      - job_name: 'slice-1-smf'
        static_configs:
          - targets: ['smf-metrics.slice-1.svc.cluster.local:9090']
            labels:
              slice_id: slice-1
              nf_type: smf
      - job_name: 'slice-2-smf'
        static_configs:
          - targets: ['smf-metrics.slice-2.svc.cluster.local:9090']
            labels:
              slice_id: slice-2
              nf_type: smf
